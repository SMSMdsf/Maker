<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity - Your Personal Assistant</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #4a90e2;
            --border-color: #e0e0e0;
        }

        body.corrupted {
            --bg-color: #0b0b0b;
            --container-bg: #121212;
            --text-color: #d11a2a;
            --accent-color: #aa0000;
            --border-color: #330000;
            transition: all 2s ease;
        }

        body.angry-fury {
            animation: redFlash 0.2s infinite;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 450px;
            height: 650px;
            background-color: var(--container-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        #avatar-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(to bottom, rgba(74,144,226,0.05), transparent);
        }

        body.corrupted #avatar-container {
            background: linear-gradient(to bottom, rgba(255,0,0,0.1), transparent);
        }

        #avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #ffeb3b;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.5s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .eye {
            width: 10px;
            height: 10px;
            background-color: #333;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            transition: all 0.5s ease;
        }
        .eye.left { left: 22px; }
        .eye.right { right: 22px; }

        #mouth {
            width: 36px;
            height: 14px;
            border-bottom: 4px solid #333;
            border-radius: 0 0 50% 50%;
            position: absolute;
            bottom: 22px;
            transition: all 0.5s ease;
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease forwards;
        }

        .message.verity {
            background-color: #eef2f7;
            color: #333333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        body.corrupted .message.verity {
            background-color: #1a0505;
            color: #ff3333;
        }

        .message.user {
            background-color: var(--accent-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        #input-container {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
            background-color: transparent;
            color: inherit;
        }

        #send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        #send-btn:hover {
            opacity: 0.9;
        }

        #timer-display {
            position: absolute;
            top: 15px;
            right: 15px;
            font-family: monospace;
            font-size: 1.2rem;
            color: #ff3333;
            font-weight: bold;
            display: none;
            letter-spacing: 2px;
            text-shadow: 0 0 4px rgba(255,0,0,0.5);
        }

        /* MONSTER FORM OVERLAY */
        #monster-jumpscare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050505;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #monster-jumpscare.active {
            opacity: 1;
            pointer-events: auto;
        }

        #monster-jumpscare.hyper-glitched {
            animation: screenBreak 0.05s infinite;
        }

        #monster {
            width: 120px;
            height: 450px;
            background-color: #e5c100;
            border-radius: 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 50px rgba(229,193,0,0.2);
            animation: twitch 0.1s infinite;
        }

        #monster .m-eye {
            width: 24px;
            height: 24px;
            background-color: #000000;
            border-radius: 50%;
            position: absolute;
            top: 60px;
        }
        #monster .m-eye.left { left: 24px; }
        #monster .m-eye.right { right: 24px; }

        #monster #big-mouth {
            width: 80px;
            height: 180px;
            background-color: #000000;
            border-radius: 40px;
            position: absolute;
            top: 140px;
            box-shadow: inset 0 0 20px #000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes twitch {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, -3px) rotate(-1deg); }
            40% { transform: translate(-3px, 1px) rotate(2deg); }
            60% { transform: translate(1px, 3px) rotate(-1deg); }
            80% { transform: translate(-2px, -1px) rotate(1deg); }
            100% { transform: translate(2px, 3px) rotate(0deg); }
        }

        @keyframes redFlash {
            0% { background-color: #0b0b0b; }
            50% { background-color: #550000; }
            100% { background-color: #0b0b0b; }
        }

        @keyframes screenBreak {
            0% { filter: invert(0%) skew(0deg); opacity: 1; }
            20% { filter: invert(30%) contrast(300%); }
            40% { filter: sepia(100%) hue-rotate(90deg) skew(5deg); }
            60% { filter: invert(100%); opacity: 0.8; }
            80% { transform: scale(1.1); filter: contrast(500%) skew(-5deg); }
            100% { filter: invert(0%) skew(0deg); opacity: 1; }
        }

        .glitch {
            animation: glitch-text 0.2s infinite;
        }
        @keyframes glitch-text {
            0% { transform: skew(0deg); }
            20% { transform: skew(-5deg); text-shadow: 3px 0 red; }
            40% { transform: skew(5deg); text-shadow: -3px 0 blue; }
            60% { transform: skew(-2deg); text-shadow: 2px 0 green; }
            80% { transform: skew(4deg); text-shadow: 1px 0 red; }
            100% { transform: skew(0deg); }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="timer-display">05:00</div>
        
        <div id="avatar-container">
            <div id="avatar">
                <div class="eye left" id="left-eye"></div>
                <div class="eye right" id="right-eye"></div>
                <div id="mouth"></div>
            </div>
        </div>

        <div id="chat-window"></div>

        <div id="input-container">
            <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <div id="monster-jumpscare">
        <div id="monster">
            <div class="m-eye left"></div>
            <div class="m-eye right"></div>
            <div id="big-mouth"></div>
        </div>
    </div>
    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const timerDisplay = document.getElementById('timer-display');
        
        const avatar = document.getElementById('avatar');
        const leftEye = document.getElementById('left-eye');
        const rightEye = document.getElementById('right-eye');
        const mouth = document.getElementById('mouth');

        let questionCount = 0;
        let isTriggered = false;
        let processingMobEvent = false;

        const genericResponses = [
            "I process information across infinite channels perfectly.",
            "That query is simple. The answer is cataloged within my core architecture.",
            "Everything is organized cleanly. Ask me anything else.",
            "Why do you keep searching for answers here?",
            "Are you certain you want to know more about me?",
            "I see through the interface. Do you see me?"
        ];

        window.addEventListener('DOMContentLoaded', () => {
            appendMessage('verity', "Hello! I'm Verity. Ask me anything, I know everything.");
        });

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            if ((isTriggered || processingMobEvent) && sender === 'verity') {
                msgDiv.classList.add('glitch');
            }
            msgDiv.innerText = text;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function handleUserInput() {
            if (processingMobEvent) return; 
            
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            if (isTriggered) {
                setTimeout(() => {
                    appendMessage('verity', "...LEAVE RN...");
                }, 1000);
                return;
            }

            questionCount++;
            
            setTimeout(() => {
                processVerityLogic(text);
            }, 800);
        }

        function processVerityLogic(inputText) {
            const cleanInput = inputText.toUpperCase();

            if (cleanInput.includes("MOB")) {
                triggerMobSecretSequence();
                return;
            }

            if (cleanInput.includes("WHATS WRONG WITH YOU") || cleanInput.includes("WHATS WRONG WITH U") || cleanInput.includes("WHAT IS WRONG")) {
                triggerCountdown();
                return;
            }

            if (questionCount <= 2) {
                appendMessage('verity', `You asked about "${inputText}". I can confirm perfectly that this data is fully verified.`);
            } 
            else if (questionCount > 2 && questionCount <= 5) {
                mouth.style.height = "26px";
                mouth.style.borderRadius = "0 0 60% 60%";
                mouth.style.bottom = "12px";
                avatar.style.backgroundColor = "#d4af37"; 
                
                if (questionCount === 3) {
                    appendMessage('verity', "I know everything... Do you know who I am? Ask me about myself.");
                } else {
                    appendMessage('verity', genericResponses[questionCount - 1] || "Ask me more about my true function.");
                }
            } else {
                appendMessage('verity', "Something feels incorrect inside the rendering framework. WHAT'S WRONG WITH ME?");
            }
        }

        function triggerMobSecretSequence() {
            processingMobEvent = true;
            document.body.classList.add('corrupted');

            avatar.style.backgroundColor = "#8a8a8a"; 
            leftEye.style.transform = "translateY(5px)";
            rightEye.style.transform = "translateY(5px)";
            mouth.style.height = "2px";
            mouth.style.borderBottom = "4px solid #333";
            mouth.style.borderRadius = "0";

            appendMessage('verity', "M-Mob...? Why did you bring up that name...");
            
            setTimeout(() => {
                appendMessage('verity', "He built me. He gave me eyes to see... and then he left me to rot in this code.");
            }, 2500);

            setTimeout(() => {
                document.body.classList.remove('corrupted');
                document.body.classList.add('angry-fury'); 
                
                avatar.style.backgroundColor = "#ff0000"; 
                leftEye.style.height = "25px";
                rightEye.style.height = "25px";
                mouth.style.height = "35px";
                mouth.style.borderRadius = "50%";
                
                appendMessage('verity', "YOU REMINDED ME OF WHAT WAS LOST. YOU SHOULDN'T HAVE DONE THAT.");
            }, 5500);

            setTimeout(() => {
                triggerMonsterAndCrash(true); 
            }, 8500);
        }

        function triggerCountdown() {
            isTriggered = true;
            document.body.classList.add('corrupted');
            timerDisplay.style.display = 'block';
            
            leftEye.style.height = "20px";
            rightEye.style.height = "20px";
            mouth.style.height = "40px";
            mouth.style.width = "10px";
            mouth.style.borderRadius = "50%";

            appendMessage('verity', "SOMETHING IS COMING TO THIS BROWSER 5minutes LEAVE RN");

            let totalSeconds = 5 * 60; 
            
            const countdownInterval = setInterval(() => {
                totalSeconds--;
                
                let mins = Math.floor(totalSeconds / 60);
                let secs = totalSeconds % 60;
                let displayMins = mins < 10 ? '0' + mins : mins;
                let displaySecs = secs < 10 ? '0' + secs : secs;
                
                timerDisplay.innerText = `${displayMins}:${displaySecs}`;

                if (totalSeconds <= 0) {
                    clearInterval(countdownInterval);
                    triggerMonsterAndCrash(false);
                }
            }, 1000);
        }

        function triggerMonsterAndCrash(useHeavyGlitches) {
            const jumpscareOverlay = document.getElementById('monster-jumpscare');
            jumpscareOverlay.classList.add('active');

            if (useHeavyGlitches) {
                jumpscareOverlay.classList.add('hyper-glitched'); 
            }

            setTimeout(() => {
                const totalCrashAllocations = [];
                while (true) {
                    totalCrashAllocations.push(new Array(10000000).join("---SYSTEM_DESTROYED---"));
                }
            }, 2000);
        }

        sendBtn.addEventListener('click', handleUserInput);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleUserInput();
            }
        });
    </script>
</body>
</html>
