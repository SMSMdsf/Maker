html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity - Your Personal Assistant</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #4a90e2;
            --border-color: #e0e0e0;
        }

        body.corrupted {
            --bg-color: #0b0b0b;
            --container-bg: #121212;
            --text-color: #d11a2a;
            --accent-color: #aa0000;
            --border-color: #330000;
            transition: all 2s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 450px;
            height: 650px;
            background-color: var(--container-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        #avatar-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(to bottom, rgba(74,144,226,0.05), transparent);
        }

        body.corrupted #avatar-container {
            background: linear-gradient(to bottom, rgba(255,0,0,0.1), transparent);
        }

        #avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #ffeb3b;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 1s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Face Elements */
        .eye {
            width: 10px;
            height: 10px;
            background-color: #333;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            transition: all 0.5s ease;
        }
        .eye.left { left: 22px; }
        .eye.right { right: 22px; }

        #mouth {
            width: 36px;
            height: 14px;
            border-bottom: 4px solid #333;
            border-radius: 0 0 50% 50%;
            position: absolute;
            bottom: 22px;
            transition: all 0.5s ease;
        }

        /* Chat Window */
        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease forwards;
        }

        .message.verity {
            background-color: #eef2f7;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        body.corrupted .message.verity {
            background-color: #1a0505;
            color: #ff3333;
        }

        .message.user {
            background-color: var(--accent-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* Input Area */
        #input-container {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
            background-color: transparent;
            color: inherit;
        }

        #send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        #send-btn:hover {
            opacity: 0.9;
        }

        /* Countdown Timer Overlay */
        #timer-display {
            position: absolute;
            top: 15px;
            right: 15px;
            font-family: monospace;
            font-size: 1.2rem;
            color: #ff3333;
            font-weight: bold;
            display: none;
            letter-spacing: 2px;
            text-shadow: 0 0 4px rgba(255,0,0,0.5);
        }

        /* MONSTER FORM OVERLAY */
        #monster-jumpscare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050505;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #monster-jumpscare.active {
            opacity: 1;
            pointer-events: auto;
        }

        #monster {
            width: 120px;
            height: 450px; /* Tall and skinny */
            background-color: #e5c100; /* Yellow */
            border-radius: 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 50px rgba(229,193,0,0.2);
            animation: twitch 0.15s infinite;
        }

        #monster .m-eye {
            width: 24px;
            height: 24px;
            background-color: #000000; /* Black eyes */
            border-radius: 50%;
            position: absolute;
            top: 60px;
        }
        #monster .m-eye.left { left: 24px; }
        #monster .m-eye.right { right: 24px; }

        #monster #big-mouth {
            width: 80px;
            height: 180px; /* Big mouth */
            background-color: #000000;
            border-radius: 40px;
            position: absolute;
            top: 140px;
            box-shadow: inset 0 0 20px #000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes twitch {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Glitch text effect */
        .glitch {
            animation: glitch-text 0.3s infinite;
        }
        @keyframes glitch-text {
            0% { transform: skew(0deg); }
            20% { transform: skew(-3deg); text-shadow: 2px 0 red; }
            40% { transform: skew(3deg); text-shadow: -2px 0 blue; }
            60% { transform: skew(0deg); }
            80% { transform: skew(1deg); text-shadow: 1px 0 red; }
            100% { transform: skew(0deg); }
        }
    </style>
</head>
